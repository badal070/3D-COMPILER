[package]
name = "compiler-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "lib.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

dsl_compiler = { package = "dsl-compiler", path = "../dsl" }
runtime = { path = "../compiler/runtime" }