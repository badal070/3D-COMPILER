# Cargo.toml (root workspace)

[workspace]
members = [
    "dsl",
    "compiler/runtime",
    "compiler/renderer",
    "compiler/ir",
    "llm_orchestrator",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1
