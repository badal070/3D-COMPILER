<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>edu3d Modeling Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #f4f1e8;
      --bg-1: #e6decf;
      --ink-1: #20211d;
      --ink-2: #4a4d44;
      --panel: rgba(255, 255, 255, 0.76);
      --line: rgba(32, 33, 29, 0.16);
      --accent: #cc5427;
      --accent-soft: rgba(204, 84, 39, 0.18);
      --ok: #227948;
      --err: #b22e2e;
      --shadow: 0 16px 36px rgba(27, 27, 23, 0.15);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(1000px 540px at 100% 0%, rgba(204, 84, 39, 0.11), transparent),
        radial-gradient(900px 520px at 0% 100%, rgba(34, 121, 72, 0.08), transparent),
        linear-gradient(145deg, var(--bg-0), var(--bg-1));
      color: var(--ink-1);
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(250px, 22vw) 1fr minmax(310px, 30vw);
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .panel-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--ink-2);
      font-size: 0.82rem;
    }

    .section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      min-height: 0;
    }

    .section:last-child { border-bottom: 0; }

    .feature-tree {
      overflow: auto;
      flex: 1;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .feature-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.56);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .feature-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .prompt-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input, textarea, button {
      font: inherit;
    }

    input[type="text"], textarea {
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      padding: 10px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--ink-1);
    }

    textarea { resize: vertical; min-height: 90px; }

    button {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--ink-1);
      padding: 9px 12px;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.ghost {
      background: transparent;
    }

    .viewport {
      position: relative;
      min-height: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #f8f3e5, #ded3be);
    }

    #viewport-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .viewport-toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      display: grid;
      gap: 8px;
      z-index: 5;
      max-width: calc(100% - 20px);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .status-chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.76rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.85);
    }

    .status-chip.ok { color: var(--ok); }
    .status-chip.err { color: var(--err); }

    .right-scroll {
      overflow: auto;
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 10px;
      background: rgba(255, 255, 255, 0.74);
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 0.84rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    #dsl-editor, #description-editor {
      min-height: 220px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #fcfbf7;
    }

    #compile-errors {
      margin: 0;
      padding-left: 18px;
      color: var(--err);
      font-size: 0.82rem;
      min-height: 1rem;
    }

    .properties-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 8px;
      font-size: 0.82rem;
    }

    .mono {
      font-family: "IBM Plex Mono", monospace;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(280px, 42vh) auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel">
      <div class="panel-head">
        <div>
          <div class="title">Feature Tree</div>
          <div class="subtitle">Ordered parametric history</div>
        </div>
        <span id="ws-status" class="status-chip">WS Offline</span>
      </div>
      <div class="section feature-tree" id="feature-tree"></div>
      <div class="section">
        <div class="subtitle" style="margin-bottom:6px;">LLM Prompt</div>
        <div class="prompt-row">
          <input id="llm-prompt" type="text" placeholder="Describe a change..." />
          <button id="llm-send" class="primary">Apply</button>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button id="llm-refine" class="ghost">Refine</button>
          <button id="llm-explain" class="ghost">Explain</button>
        </div>
      </div>
    </aside>

    <main class="panel viewport">
      <div class="viewport-toolbar">
        <div class="toolbar-group">
          <button id="toggle-snap" class="ghost">Snap: On</button>
          <button id="toggle-measure" class="ghost">Measure</button>
          <button id="toggle-drag" class="ghost">Drag</button>
        </div>
        <div class="toolbar-group">
          <button id="mode-translate" class="primary">Move (W)</button>
          <button id="mode-rotate" class="ghost">Rotate (E)</button>
          <button id="mode-scale" class="ghost">Scale (R)</button>
        </div>
        <div class="toolbar-group">
          <button data-shape="box" class="ghost">+ Box</button>
          <button data-shape="cylinder" class="ghost">+ Cylinder</button>
          <button data-shape="sphere" class="ghost">+ Sphere</button>
          <button data-shape="cone" class="ghost">+ Cone</button>
          <button data-shape="torus" class="ghost">+ Torus</button>
        </div>
      </div>
      <canvas id="viewport-canvas"></canvas>
    </main>

    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="title">Inspector + DSL</div>
          <div class="subtitle">Properties, description JSON, and direct script mode</div>
        </div>
        <span id="compile-status" class="status-chip">Idle</span>
      </div>
      <div class="right-scroll">
        <div class="card">
          <h3>Properties</h3>
          <div id="properties" class="properties-grid"></div>
        </div>

        <div class="card">
          <h3>Model Description JSON</h3>
          <div id="description-editor"></div>
          <div style="margin-top:8px;display:flex;justify-content:flex-end;gap:8px;">
            <button id="translate-description" class="primary">Translate -> DSL</button>
          </div>
        </div>

        <div class="card">
          <h3>DSL Editor</h3>
          <div id="dsl-editor"></div>
          <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <button id="save-model" class="ghost">Save Model</button>
            <button id="compile-dsl" class="primary">Compile</button>
          </div>
          <ul id="compile-errors"></ul>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
