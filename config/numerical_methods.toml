[integration]
default_method = "adaptive_simpson"
default_tolerance = 1e-8
max_iterations = 10000

[ode_solving]
default_method = "rk45"
default_step_size = 0.01
adaptive = true
tolerance = 1e-6

[root_finding]
default_method = "newton_raphson"
max_iterations = 100
tolerance = 1e-10

[optimization]
default_method = "gradient_descent"
learning_rate = 0.01
max_iterations = 1000
