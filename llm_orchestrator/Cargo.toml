[package]
name = "llm_orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.11", optional = true, features = ["blocking", "json"] }

[features]
http = ["reqwest"]

[lib]
name = "llm_orchestrator"
path = "src/lib.rs"
